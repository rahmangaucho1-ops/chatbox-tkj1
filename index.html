
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot Pembelajaran TKJ</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #e8f0f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.chatbox {
    width: 350px;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px #999;
}

.header {
    background: #087e8b;
    color: white;
    padding: 18px;
    text-align: center;
    font-weight: bold;
}

#pesan {
    height: 350px;
    padding: 12px;
    overflow-y: auto;
}

.chat {
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    max-width: 80%;
    overflow-wrap: anywhere;
}

.user {
    background: #ccebd5;
    margin-left: auto;
    text-align: right;
}

.bot {
    background: #eeeeee;
    margin-right: auto;
}

.input-area {
    display: flex;
    padding: 10px;
    border-top: 1px solid #ddd;
}

input {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    background: #087e8b;
    color: white;
    border: none;
    padding: 10px 15px;
    margin-left: 5px;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="chatbox">
    <div class="header">
        CHATBOT PEMBELAJARAN TKJ
    </div>

    <div id="pesan">
        <div class="chat bot">
            Halo! Selamat datang di Chatbot TKJ.
            Ada yang ingin kamu pelajari?
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="inputPesan"
        placeholder="Ketik pesan..."
        onkeydown="if(event.key==='Enter') kirimPesan()">

        <button onclick="kirimPesan()">Kirim</button>
    </div>
</div>

<script>
function kirimPesan() {
    let input = document.getElementById("inputPesan");
    let pesan = input.value.trim();

    if (pesan === "") return;

    tampilkanPesan(pesan, "user");

    let pertanyaan = pesan.toLowerCase();
    let jawaban = "";

    if (pertanyaan.includes("halo")) {
        jawaban = "Halo juga! Selamat belajar TKJ.";
    }
    else if (pertanyaan.includes("komputer")) {
        jawaban = "Komputer adalah perangkat elektronik untuk mengolah data.";
    }
    else if (pertanyaan.includes("ip address")) {
        jawaban = "IP Address adalah alamat identitas perangkat dalam jaringan.";
    }
    else if (pertanyaan.includes("jaringan")) {
        jawaban = "Jaringan komputer menghubungkan dua perangkat atau lebih.";
    }
    else if (pertanyaan.includes("router")) {
        jawaban = "Router berfungsi menghubungkan jaringan yang berbeda.";
    }
    else if (pertanyaan.includes("mikrotik")) {
        jawaban = "Mikrotik adalah perangkat dan sistem operasi untuk manajemen jaringan.";
    }
    else if (pertanyaan.includes("debian")) {
        jawaban = "Debian adalah sistem operasi Linux yang banyak digunakan sebagai server.";
    }
    else {
        jawaban = "Maaf, saya belum memahami pertanyaan tersebut. Coba tanyakan tentang komputer, IP Address, jaringan, Router, Mikrotik, atau Debian.";
    }

    setTimeout(function() {
        tampilkanPesan(jawaban, "bot");
    }, 500);

    input.value = "";
}

function tampilkanPesan(teks, jenis) {
    let area = document.getElementById("pesan");
    let chat = document.createElement("div");

    chat.className = "chat " + jenis;
    chat.textContent = teks;

    area.appendChild(chat);
    area.scrollTop = area.scrollHeight;
}
</script>

</body>
</html>
